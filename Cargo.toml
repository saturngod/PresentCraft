[package]
name = "presentcraft"
version = "0.0.7"
edition = "2021"

[[bin]]
name = "PresentCraft"
path = "src/main.rs"

[dependencies]
eframe = "=0.37.0"
egui = "=0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.15"
ttf-parser = "0.25.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
