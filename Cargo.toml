[package]
name = "presentcraft"
version = "0.0.10"
edition = "2021"

[[bin]]
name = "PresentCraft"
path = "src/main.rs"

[dependencies]
eframe = "=0.37.0"
egui = "=0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.15"
ttf-parser = "0.25.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

# YouTube's embedded player in the system's web view (see src/webvideo.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.57"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
