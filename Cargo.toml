[package]
name = "presentcraft"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "PresentCraft"
path = "src/main.rs"

[dependencies]
eframe = "=0.37.0"
egui = "=0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.15"
ttf-parser = "0.25.1"
# Material Symbols, the icons on Windows and Linux (see src/icons.rs).
egui_material_icons = { version = "0.9", features = ["filled", "outline", "compressed"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

# YouTube's embedded player in the system's web view (see src/webvideo.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.57"

# The menu bar at the top of the screen (see src/macos_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# SF Symbols drawn by AppKit, the icons on macOS (see src/icons.rs).
objc2 = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
